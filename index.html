Rarity Rng

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rarity RNG</title>
  <style>
    body {
      font-family: 'Comic Sans MS', cursive, sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #d0f0fd, #fdf5e6);
      color: #333;
      transition: background-color 0.5s ease;
    }
    button {
      padding: 12px 25px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 30px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(to bottom, #ffcc00, #ff9900);
      color: #fff;
      font-weight: bold;
      box-shadow: 0 5px #cc7a00;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    .result {
      margin-top: 20px;
      font-size: 30px;
      font-weight: bold;
      color: #3366cc;
      transition: transform 0.3s ease;
      text-shadow: 1px 1px #ccc;
    }
    .result-mythic {
      color: red !important;
      text-shadow: 0 0 10px red, 0 0 20px red;
    }
    .log {
      margin-top: 40px;
      max-height: 200px;
      overflow-y: auto;
      border-top: 2px dashed #ccc;
      padding-top: 20px;
      font-size: 18px;
    }
    .raritydex-toggle {
      position: fixed;
      top: 20px;
      right: 150px;
      z-index: 1100;
    }
    .roll-counter {
      position: fixed;
      top: 20px;
      right: 20px;
      background-color: #fff8dc;
      border: 2px solid #ffa500;
      padding: 10px 15px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 18px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
    }
    .raritydex {
      display: none;
      position: fixed;
      top: 70px;
      right: 20px;
      width: 350px;
      background-color: #fff8dc;
      border-radius: 15px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      z-index: 1000;
      border: 3px solid #ffa500;
    }
    .rarity-entry {
      display: flex;
      justify-content: space-between;
      padding: 8px;
      border-bottom: 1px dashed #aaa;
      font-size: 16px;
    }
    .rarity-entry:last-child {
      border-bottom: none;
    }
    .rarity-name {
      font-weight: bold;
    }
    .rarity-info {
      text-align: right;
    }
    .market-menu {
      display: none;
      position: fixed;
      top: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: #fff;
      border: 2px solid #333;
      padding: 20px;
      z-index: 2000;
      width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .market-menu h3 {
      margin-top: 0;
    }
  </style>
</head>
<body>
  <h1 style="font-size: 40px; color: #ff6600; text-shadow: 2px 2px #ffe0b3;">
    Rarity R<span onclick="toggleMarket()" style="cursor:pointer; color:#000; text-decoration:underline">N</span>G

  <button onclick="rollRNG()">Roll</button>
  <div class="result" id="result"></div>

  <div class="raritydex-toggle">

  </div>

  <div class="roll-counter" id="roll-counter">Rolls: 0</div>

  <div class="raritydex" id="raritydex">
    <h2>Rarity Dex</h2>
    <div id="raritydex-entries"></div>
    <button onclick="sellExtras()">Sell Extras</button>
  </div>

  <div class="market-menu" id="market">
    <h3>Black Market</h3>
    <div id="market-items"></div>
  </div>

  <audio id="roll-sound" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
  <audio id="rare-sound" src="https://actions.google.com/sounds/v1/cartoon/concussive_hit_guitar_boing.ogg"></audio>

  { name: 'Snail', chance: 28, description: 'Speed is a suggestion, not a rule.', color: '#a3e635', price: 300, sell: 180 },
  { name: 'Laser', chance: 6, description: 'Pew pew and regret.', color: '#60a5fa', price: 1400, sell: 1000 },

  { name: 'Drizzle', chance: 10.2, description: 'Wet disappointment in atmospheric form.', color: '#bae6fd', price: 600, sell: 400 },

  { name: 'Quicksand', chance: 3.3, description: 'It’ll suck you in, but you won’t even notice.', color: '#d97706', price: 1800, sell: 1200 },
  { name: 'Spork', chance: 22.1, description: 'Neither a spoon nor a fork, but both somehow worse.', color: '#e5e7eb', price: 350, sell: 250 },
  { name: 'Bamboo', chance: 29.4, description: 'The fastest-growing tree that knows no boundaries.', color: '#84cc16', price: 450, sell: 200 },
  { name: 'Cricket', chance: 14.0, description: 'Creeping in your ear. Literally.', color: '#f9a8d4', price: 800, sell: 500 },
  { name: 'Fluff', chance: 37.8, description: 'Light as air. Worth less than it sounds.', color: '#f3f4f6', price: 120, sell: 60 },
  { name: 'Hammock', chance: 19.6, description: 'Lazy comfort, until it rips.', color: '#9ca3af', price: 600, sell: 400 },
  { name: 'Candle', chance: 25.1, description: 'Burning bright until you forget it’s there.', color: '#facc15', price: 400, sell: 250 },
  { name: 'Scissors', chance: 9.2, description: 'Sharp enough to cut ties with reality.', color: '#d1d5db', price: 700, sell: 500 },
  { name: 'Skeleton', chance: 2.6, description: 'It has all the bones, just not much else.', color: '#e4e4e7', price: 2500, sell: 2000 },
  { name: 'Nap', chance: 49.7, description: 'You’ll wake up and forget it ever happened.', color: '#a3e635', price: 100, sell: 20 },
  { name: 'Raincoat', chance: 13.0, description: 'Keeps you dry... just barely.', color: '#6ee7b7', price: 750, sell: 500 },
  { name: 'Lantern', chance: 6.8, description: 'Lit, but only just enough to make you paranoid.', color: '#fde68a', price: 900, sell: 700 },
  { name: 'Cloud', chance: 34.5, description: 'Fluffy and potentially full of stormy regret.', color: '#f3f4f6', price: 300, sell: 200 },
  { name: 'Gears', chance: 8.3, description: 'Turning, clicking, and probably about to malfunction.', color: '#f9a8d4', price: 1000, sell: 600 },
  { name: 'Frost', chance: 5.4, description: 'Cooler than your ex.', color: '#d1d5db', price: 1200, sell: 900 },
  { name: 'Moss', chance: 15.2, description: 'It’ll grow on you. Literally.', color: '#16a34a', price: 500, sell: 300 },
  { name: 'Hug', chance: 18.5, description: 'Warm, and probably slightly awkward.', color: '#fcd34d', price: 400, sell: 250 },
  { name: 'Pineapple', chance: 20.4, description: 'Sweet on the inside, confusing on the outside.', color: '#fbbf24', price: 550, sell: 300 },
  { name: 'Spider', chance: 4.2, description: 'Eight legs to ruin your day.', color: '#e5e7eb', price: 1500, sell: 1000 }
    ];

    const achievements = [
  { name: 'Lucky Charm', description: 'A small trinket that guarantees beginners luck.', price: 1 },
  { name: 'Streak of Fortune', description: 'A token that reminds you of your fleeting luck.', price: 5 },
  { name: 'Centurion\'s Badge', description: 'A badge signifying you\'ve rolled a hundred times.', price: 10 },
  { name: 'Endless Determination', description: 'A relic that helps you roll with relentless persistence.', price: 20 },
  { name: 'RNG Masterpiece', description: 'A finely crafted item for the true RNG master.', price: 30 },
  { name: 'Troll\'s Trophy', description: 'An award for achieving the perfect number of 1s.', price: 25 },
  { name: 'Overachiever\'s Medal', description: 'A medal for those who keep rolling way past reasonable limits.', price: 50 },
  { name: 'Insomniac\'s Pass', description: 'A pass granting the ability to roll endlessly for 24 hours.', price: 100 },
  { name: 'Scavenger\'s Hoard', description: 'A chest filled with all the little trinkets you’ve picked up along the way.', price: 8 },
  { name: 'Collector\'s Bundle', description: 'A bundle of everything you’ve hoarded so far.', price: 15 },
  { name: 'Shiny Collector\'s Box', description: 'A box for your precious rare finds that never seem to show up enough.', price: 12 },
  { name: 'Lucky Sevens Token', description: 'A token with a lucky number that appears when fate smiles on you.', price: 7 },
  { name: 'Critical Hit Crystal', description: 'A crystal that glows brightly when you finally roll that perfect 20.', price: 50 },
  { name: 'Roller\'s Obsession', description: 'A relic that signifies your addiction to rolling – you’ll never stop now.', price: 15 },
  { name: 'Glitch in the System', description: 'A strange artifact that distorts the RNG in strange ways.', price: 20 },
  { name: 'Gambler\'s Dream', description: 'A token of luck that grants you rare, fleeting wins.', price: 25 },
  { name: 'Unlucky Coin', description: 'A coin that always lands on the wrong side of fate.', price: 30 },
  { name: 'Perseverance Medal', description: 'A medal for those who just can’t give up, no matter how many times they fail.', price: 10 },
  { name: 'RNG Obsession', description: 'A badge for those who’ve gone too deep into the game’s random nature.', price: 50 }
    ];

    let counts = JSON.parse(localStorage.getItem('rngCounts')) || {};
    let totalRolls = parseInt(localStorage.getItem('totalRolls')) || 0;
    let coins = parseInt(localStorage.getItem('coins')) || 0;
    const rollCounter = document.getElementById('roll-counter');

    rngItems.forEach(item => {
      if (!counts[item.name]) counts[item.name] = 0;
    });

    function saveCounts() {
      localStorage.setItem('rngCounts', JSON.stringify(counts));
      localStorage.setItem('totalRolls', totalRolls);
      localStorage.setItem('coins', coins);
    }

    function toggleRaritydex() {
      const dex = document.getElementById('raritydex');
      dex.style.display = dex.style.display === 'none' ? 'block' : 'none';
    }

    function toggleMarket() {
      const market = document.getElementById('market');
      market.style.display = market.style.display === 'none' ? 'block' : 'none';
      renderMarket();
    }

    function rollRNG() {
      const resultElement = document.getElementById('result');
      const logElement = document.getElementById('log');
      const rollSound = document.getElementById('roll-sound');
      const rareSound = document.getElementById('rare-sound');

      rollSound.play();
      let found = 'Nothing';
      const sortedItems = rngItems.sort((a, b) => b.chance - a.chance);
      for (const item of sortedItems) {
        if (Math.random() * 100 < item.chance) {
          found = item.name;
          counts[found]++;
          totalRolls++;
          saveCounts();
          break;
        }
      }
      if (["Legendary", "Mythic", "Glitched"].includes(found)) rareSound.play();

      resultElement.innerText = `You rolled: ${found}`;
      resultElement.classList.remove('result-mythic');
      if (found === 'Mythic') resultElement.classList.add('result-mythic');
      resultElement.style.transform = 'scale(1.2)';
      setTimeout(() => resultElement.style.transform = 'scale(1)', 150);

      const entry = document.createElement('div');
      entry.innerText = `Rolled: ${found}`;
      logElement.prepend(entry);
      updateRaritydex();
      updateRollCounter();
    }

    function updateRaritydex() {
      const dex = document.getElementById('raritydex-entries');
      dex.innerHTML = '';
      rngItems.forEach(item => {
        const entry = document.createElement('div');
        entry.className = 'rarity-entry';
        const left = document.createElement('div');
        left.className = 'rarity-name';
        left.innerText = counts[item.name] > 0 ? item.name : '???';
        const right = document.createElement('div');
        right.className = 'rarity-info';
        right.innerHTML = `
          ${counts[item.name] || 0}x<br />
          ${item.chance}% Chance<br />
          ${counts[item.name] > 0 ? `"${item.description}"` : ''}<br />
          <button onclick="document.body.style.background='${item.color}'">Set Background</button>
        `;
        entry.appendChild(left);
        entry.appendChild(right);
        dex.appendChild(entry);
      });
    }

    function updateRollCounter() {
      rollCounter.innerText = `Rolls: ${totalRolls} | Coins: ${coins}`;
    }

    function sellExtras() {
      rngItems.forEach(item => {
        if (counts[item.name] > 1) {
          coins += (counts[item.name] - 1) * item.sell;
          counts[item.name] = 1;
        }
      });
      saveCounts();
      updateRaritydex();
      updateRollCounter();
    }

    function renderMarket() {
      const container = document.getElementById('market-items');
      container.innerHTML = '';
      rngItems.forEach(item => {
        if (counts[item.name] > 0) {
          const div = document.createElement('div');
          div.innerHTML = `${item.name} - ${item.price} coins <button onclick="buyItem('${item.name}', ${item.price})">Buy</button>`;
          container.appendChild(div);
        }
      });
      achievements.forEach(ach => {
        const div = document.createElement('div');
        div.innerHTML = `Achievement: ${ach.name} - ${ach.price} coins<br>${ach.description} <button onclick="buyItem('${ach.name}', ${ach.price})">Buy</button>`;
        container.appendChild(div);
      });
    }

    function buyItem(name, price) {
      if (coins >= price) {
        coins -= price;
        alert(`You bought ${name}`);
        saveCounts();
        updateRollCounter();
      } else {
        alert('Not enough coins!');
      }
    }

    updateRaritydex();
    updateRollCounter();
  </script>
</body>
</html>
